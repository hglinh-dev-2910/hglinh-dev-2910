name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- LIGHT THEME IMAGES ---
      - name: Generate Stats (Light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=hglinh-dev-2910&show_icons=true&theme=default&hide_border=true&count_private=true
          path: profile/stats-light.svg
          token: ${{ secrets.GH_STATS }}

      - name: Generate Top Languages (Light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=hglinh-dev-2910&layout=compact&langs_count=8&theme=default&hide_border=true&count_private=true
          path: profile/top-langs-light.svg
          token: ${{ secrets.GH_STATS }}

      # --- DARK THEME IMAGES ---
      - name: Generate Stats (Dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=hglinh-dev-2910&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GH_STATS }}

      - name: Generate Top Languages (Dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=hglinh-dev-2910&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&count_private=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GH_STATS }}

      # --- COMMIT EVERYTHING ---
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No stats changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub stats"
          git push origin main